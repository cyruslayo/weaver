name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up pnpm
        run: |
          npm install --global pnpm@10.15.0
          test "$(pnpm --version)" = "10.15.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated Basic Catalog
        run: pnpm check:generated

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check A2UI v0.9.1 conformance
        run: pnpm conformance:v0.9.1

      - name: Verify packed packages
        run: pnpm verify:packages
