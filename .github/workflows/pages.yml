name: Playground Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build playground
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up pnpm
        run: |
          npm install --global pnpm@10.15.0
          test "$(pnpm --version)" = "10.15.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies of the playground
        run: pnpm --filter "@weaver/playground^..." run --if-present build

      - name: Build the playground for /weaver/playground/
        env:
          PLAYGROUND_BASE: /weaver/playground/
        run: pnpm --filter @weaver/playground build

      - name: Assemble the Pages site
        # The root is reserved for the landing page. Until it exists, the root
        # page only redirects visitors to the Playground.
        run: |
          rm -rf _site
          mkdir -p _site
          cp .github/pages/index.html _site/index.html
          cp -r examples/playground/dist _site/playground
          test -f _site/index.html
          test -f _site/playground/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
