<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My A2UI Client</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background-color: #f4f4f9; }
        
        /* This is our Trusted Catalog styling for a "Card" */
        .ui-card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            border: 1px solid #ddd;
        }
        
        /* This is our Trusted Catalog styling for "Text" */
        .ui-text {
            color: #333;
            font-size: 1.2rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>A2UI Protocol Test</h1>
    
    <!-- This empty div is the "Surface" where our AI UI will be rendered -->
    <div id="ai-surface-container">
        <p style="color: gray;">Waiting for AI stream...</p>
    </div>

    <script>
        const surfaceContainer = document.getElementById('ai-surface-container');
        
        let componentStore = {};
        let rootComponentId = null;
        
        // NEW: This dictionary holds all the data the user types in
        let dataModel = {}; 

        const eventSource = new EventSource('http://localhost:3000/a2ui-stream');

        eventSource.onmessage = (event) => {
            const message = JSON.parse(event.data);
            if (message.beginRendering) {
                rootComponentId = message.beginRendering.root;
                surfaceContainer.innerHTML = ''; 
            }
            if (message.surfaceUpdate) {
                message.surfaceUpdate.components.forEach(comp => {
                    componentStore[comp.id] = comp.component;
                });
                drawUI();
            }
            if (message.streamComplete) eventSource.close();
        };

        function drawUI() {
            if (!rootComponentId) return;
            surfaceContainer.innerHTML = ''; 
            const rootElement = buildHtmlNode(rootComponentId);
            if (rootElement) surfaceContainer.appendChild(rootElement);
        }

        // THE UPDATED TRUSTED CATALOG
        function buildHtmlNode(componentId) {
            const compData = componentStore[componentId];
            if (!compData) return null; 

            if (compData.Box) {
                const div = document.createElement('div');
                div.style.display = compData.Box.layout === 'grid' ? 'grid' : 'flex';
                div.style.flexDirection = compData.Box.direction === 'row' ? 'row' : 'column';
                div.style.gap = compData.Box.gap || '16px';
                div.style.padding = compData.Box.padding || '0px';
                if (compData.Box.children) {
                    compData.Box.children.forEach(childId => {
                        const childNode = buildHtmlNode(childId);
                        if (childNode) div.appendChild(childNode);
                    });
                }
                return div;
            }

            // NEW CATALOG RULE: Text
            if (compData.Text) {
                const el = document.createElement(compData.Text.as || 'p');
                el.innerText = compData.Text.literalString || '';
                el.style.margin = '0';
                return el;
            }

            // NEW CATALOG RULE: Field
            if (compData.Field) {
                const wrapper = document.createElement('div');
                wrapper.style.display = 'flex';
                wrapper.style.flexDirection = 'column';
                wrapper.style.gap = '4px';

                if (compData.Field.label) {
                    const label = document.createElement('label');
                    label.innerText = compData.Field.label;
                    wrapper.appendChild(label);
                }

                const input = document.createElement('input');
                input.type = compData.Field.type || 'text';
                input.placeholder = compData.Field.placeholder || '';
                input.style.padding = '8px'; input.style.margin = '8px 0'; input.style.width = '90%';
                
                // When the user types, save it to our dataModel using the AI's requested binding key
                const bindingKey = compData.Field.binding;
                input.oninput = (e) => {
                    dataModel[bindingKey] = e.target.value;
                    console.log("Current Data Model:", dataModel); // Watch this in your browser console!
                };
                wrapper.appendChild(input);
                return wrapper;
            }

            // NEW CATALOG RULE: Button
            if (compData.Button) {
                const btn = document.createElement('button');
                btn.innerText = compData.Button.label;
                btn.style.padding = '8px 16px'; btn.style.cursor = 'pointer';
                
                // When clicked, send the action name and all our dataModel back to the server
                btn.onclick = () => {
                    fetch('http://localhost:3000/ai-action', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            action: compData.Button.actionId, 
                            state: dataModel 
                        })
                    });
                };
                return btn;
            }

            console.warn("Ignoring unknown component type:", compData);
            return null; 
        }
    </script>

</body>
</html>
